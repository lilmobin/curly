<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>for Curly Lily</title>
  <meta name="description" content="for Curly Lily">

  <!-- Optional web fonts (only used for "Loading..." and the player text).
       The page looks right without them thanks to the fallbacks in the CSS. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Inter:wght@400;500&display=swap">

  <style>html,body{background:#000}</style>   <!-- first paint is pure black -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-state="intro">

  <main class="stage" id="stage">

    <!-- 1. everything atmospheric is drawn here: haze, particles, light trails, the lily -->
    <canvas id="fx" aria-hidden="true"></canvas>
    <div class="dust-wrap" id="dustWrap" aria-hidden="true"><canvas class="dust dust-a" id="dustA"></canvas><canvas class="dust dust-b" id="dustB"></canvas></div>

    <!-- 2. YOUR title PNG (path is set in js/config.js → assets/title.png) -->
    <h1 class="title" id="title">
      <img class="title-glow" id="titleGlow" alt="" aria-hidden="true" decoding="async">
      <img class="title-img"  id="titleImg"  alt="for Curly Lily" decoding="async">
      <div class="title-sheen" id="titleSheen" aria-hidden="true" hidden><i></i></div>
    </h1>

    <!-- tiny glints that twinkle on the lettering once the title has arrived -->
    <div class="title-fx" id="titleFx" aria-hidden="true"><i class="glint g1"></i><i class="glint g2"></i><i class="glint g3"></i></div>

    <!-- travelling point of light that "writes" the title during the intro -->
    <div class="orb" id="orb" aria-hidden="true"></div>

    <!-- 3. one glass card: it is the loading panel first, then becomes the player -->
    <section class="glass" id="card" data-stage="hidden" aria-label="Music player">

      <!-- loading -->
      <div class="loading-ui" id="loadingUI" role="progressbar" aria-label="Loading"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <p class="loading-text">Loading...</p>
        <div class="load-track" id="loadTrack">
          <div class="load-fill" id="loadFill"></div>
          <div class="load-dot"  id="loadDot"></div>
        </div>
        <svg class="load-star" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2.6C12.5 8 16 11.5 21.4 12 16 12.5 12.5 16 12 21.4 11.5 16 8 12.5 2.6 12 8 11.5 11.5 8 12 2.6Z"
                fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/>
        </svg>
      </div>

      <!-- player -->
      <div class="player-ui" id="playerUI">
        <div class="p-top">
          <div class="art"><img id="art" alt="" decoding="async"></div>
          <div class="meta">
            <p class="song"   id="songTitle">Nightwave</p>
            <p class="artist" id="songArtist">M83</p>
          </div>
          <button class="heart" id="heartBtn" type="button" aria-label="Like this song" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.6l-1.2-1.1C6 15.3 3 12.5 3 9.1 3 6.4 5.1 4.4 7.7 4.4c1.6 0 3.1.8 4.3 2 1.2-1.2 2.7-2 4.3-2C18.9 4.4 21 6.4 21 9.1c0 3.4-3 6.2-7.8 10.4L12 20.6z"/></svg>
          </button>
        </div>

        <div class="seek" id="seek" role="slider" tabindex="0" aria-label="Seek"
             aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="0:00">
          <div class="seek-track" id="seekTrack"><div class="seek-fill" id="seekFill"></div></div>
          <div class="seek-knob" id="seekKnob"></div>
        </div>
        <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>

        <div class="controls">
          <button class="ctl" id="shuffleBtn" type="button" aria-label="Shuffle" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3.2c3.6 0 4.8 10 9.3 10H20M3 17h3.2c1.5 0 2.6-.9 3.5-2.2M14.2 9.2C15 8 16 7 17.5 7H20M17.5 4l3 3-3 3M17.5 14l3 3-3 3"/></svg>
          </button>
          <button class="ctl" id="prevBtn" type="button" aria-label="Previous">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path class="solid" d="M18.5 5.6v12.8L8.8 12z"/><path d="M5.5 5.5v13"/></svg>
          </button>
          <button class="ctl play" id="playBtn" type="button" aria-label="Play">
            <svg class="i-play"  viewBox="0 0 24 24" aria-hidden="true"><path class="solid" d="M9.2 6.6v10.8L17.6 12z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path class="solid" d="M8.4 6.8h2.4v10.4H8.4zM13.2 6.8h2.4v10.4h-2.4z"/></svg>
          </button>
          <button class="ctl" id="nextBtn" type="button" aria-label="Next">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path class="solid" d="M5.5 5.6v12.8L15.2 12z"/><path d="M18.5 5.5v13"/></svg>
          </button>
          <button class="ctl" id="repeatBtn" type="button" aria-label="Repeat" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2.5l3.5 3.5L17 9.5M3.5 11V9.5A3.5 3.5 0 017 6h13.5M7 21.5L3.5 18 7 14.5M20.5 13v1.5a3.5 3.5 0 01-3.5 3.5H3.5"/></svg>
          </button>
        </div>
      </div>
    </section>

    <audio id="audio" preload="auto" playsinline></audio>
  </main>

  <noscript>This experience needs JavaScript.</noscript>

  <script src="js/config.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/player.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
